# Hardware and calibration for the showcase robot. Servo targets are ticks
# (normally 0-1000). Start with the robot supported above the floor and tune
# each neutral/direction/limit before walking under its own weight.

[bus]
port = "/dev/ttyACM0"
baudrate = 115200
timeout = 0.05
discard_echo = false
broadcast_id = 254

[gait]
phase_duration = 0.45
sweep_ticks = 100.0
lift_femur_offset = -100.0
lift_tibia_offset = 0.0
stand_femur_offset = 0.0
stand_tibia_offset = -100.0
sit_femur_offset = -200.0
sit_tibia_offset = -300.0

# Storage configuration. The dead command first moves through the sitting pose,
# then applies these logical offsets from each joint's neutral tick. These are
# unverified starting values inferred from the old sitting pose; tune them on a
# supported robot before relying on the pose for storage.
[dead_pose]
approach_duration = 2.0
duration = 3.0
coxa_offset = 0.0
femur_offset = -250.0
tibia_offset = -330.0

# Optional per-leg overrides inherit unspecified values from [dead_pose].
# Uncomment and tune only the joints that need different clearance:
# [dead_pose.legs.front_left]
# coxa_offset = 10.0
# femur_offset = -240.0
# tibia_offset = -320.0

# Leg order follows the original bachelor code: IDs 1-12 are the left side,
# front to rear; IDs 13-24 are the right side, front to rear. Mount angles use
# x=forward and y=left. Inner legs use a smaller coxa sweep, matching the old
# HPos (corner) versus Pos (inner) movements.

[[legs]]
name = "front_left"
mount_angle_degrees = 45.0
gait_group = 0
sweep_scale = 1.0
coxa = { servo_id = 1, neutral = 500, minimum = 300, maximum = 700, direction = 1 }
femur = { servo_id = 2, neutral = 500, minimum = 200, maximum = 750, direction = 1 }
tibia = { servo_id = 3, neutral = 500, minimum = 150, maximum = 700, direction = 1 }

[[legs]]
name = "middle_front_left"
